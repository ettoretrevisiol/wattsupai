name: Lighthouse CI

on:
  push:
    branches: [main]
    paths: ['index.html']

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Run Lighthouse
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ettore.trevisiol.net/wattsupai/
          temporaryPublicStorage: true
          runs: 1

      - name: Print scores
        if: always()
        run: |
          echo "Lighthouse results:"
          echo "${{ steps.lh.outputs.manifest }}" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if data:
            r = data[0]
            print(f\"  Performance:    {round(r.get('summary',{}).get('performance',0)*100)}%\")
            print(f\"  Accessibility:  {round(r.get('summary',{}).get('accessibility',0)*100)}%\")
            print(f\"  Best Practices: {round(r.get('summary',{}).get('best-practices',0)*100)}%\")
            print(f\"  SEO:            {round(r.get('summary',{}).get('seo',0)*100)}%\")
            print(f\"  Report: {r.get('url','')}\")
          " 2>/dev/null || echo "  Scores available in uploaded report above"
